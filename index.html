<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ceazers 3D — Interactive 3D Printer · Engineering & Prototyping Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive 3D printer landing page for Ceazers 3D Engineering Solutions — click the bed to explore our services, materials, portfolio, and contact. Based in Durban, South Africa.">
<meta name="theme-color" content="#0d0e10">
<link rel="canonical" href="https://ceazers3d.com/">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Ceazers 3D — Interactive 3D Printer">
<meta property="og:description" content="Click anywhere on the bed to navigate. Industrial design, 3D printing, and rapid prototyping.">
<meta property="og:url" content="https://ceazers3d.com/">
<meta property="og:image" content="https://ceazers3d.com/images/hero.webp">
<style>
  :root{
    --bg:#0d0e10;
    --panel:#15171b;
    --ink:#f4f1ea;
    --ink-dim:#9a978f;
    --line:#26282d;
    --accent:#ff6a1a;       /* safety orange */
    --accent-dim:#b4480f;
    --green:#7ee08a;
    --amber:#ffc24a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
  canvas{display:block}
  #scene{position:fixed;inset:0}

  /* ── top brand bar ─────────────────────────── */
  .brandbar{
    position:fixed;top:0;left:0;right:0;height:64px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;z-index:5;pointer-events:none;
    background:linear-gradient(to bottom, rgba(13,14,16,.85), rgba(13,14,16,0));
  }
  .brand{
    display:flex;align-items:baseline;gap:10px;pointer-events:auto;
    font-weight:900;letter-spacing:-0.02em;
  }
  .brand .c{font-size:34px;line-height:1;font-family:"Arial Black","Helvetica Neue",sans-serif}
  .brand .c sub{font-size:14px;font-weight:900;letter-spacing:0;vertical-align:-3px}
  .brand .e{font-style:italic;font-family:"Times New Roman",serif;font-weight:500;font-size:24px;color:var(--ink)}
  .brand .e .ng{font-size:14px;color:var(--ink-dim);letter-spacing:.02em}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-left:6px}

  .topright{display:flex;gap:18px;align-items:center;pointer-events:auto;font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--ink-dim)}
  .topright .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(20,22,26,.6);backdrop-filter:blur(8px)}
  .topright .pill .led{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .topright button{appearance:none;border:1px solid var(--line);background:rgba(20,22,26,.6);color:var(--ink-dim);font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.18em;padding:8px 12px;border-radius:6px;cursor:pointer;backdrop-filter:blur(8px)}
  .topright button:hover{color:var(--ink);border-color:var(--accent)}
  .topright button.on{color:var(--accent);border-color:var(--accent)}

  /* ── bottom hint bar ───────────────────────── */
  .hintbar{
    position:fixed;bottom:0;left:0;right:0;padding:18px 24px 22px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    z-index:5;pointer-events:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);
    background:linear-gradient(to top, rgba(13,14,16,.9), rgba(13,14,16,0));
  }
  .hintbar .keys{display:flex;gap:18px;flex-wrap:wrap}
  .hintbar .keys span b{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;padding:2px 7px;border-radius:4px;color:var(--ink);font-weight:700;margin-right:6px;font-size:10px;background:rgba(20,22,26,.6)}
  .coords{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--ink);font-size:11px;letter-spacing:.1em}
  .coords .v{color:var(--accent)}

  /* ── hover label (follows cursor in screen-space) ── */
  #label{
    position:fixed;pointer-events:none;z-index:6;
    transform:translate(-50%,-130%);
    background:#0d0e10;border:1px solid var(--accent);
    color:var(--ink);padding:8px 12px;border-radius:6px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:700;display:none;white-space:nowrap;
    box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  #label .meta{font-size:9px;color:var(--ink-dim);font-weight:500;margin-top:3px;letter-spacing:.1em}
  #label::after{
    content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;
    background:#0d0e10;border-right:1px solid var(--accent);border-bottom:1px solid var(--accent);
    transform:translateX(-50%) rotate(45deg);
  }

  /* ── content drawer ────────────────────────── */
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(440px,90vw);
    background:rgba(15,17,21,.96);
    border-left:1px solid var(--line);
    backdrop-filter:blur(14px);
    transform:translateX(110%);transition:transform .55s cubic-bezier(.7,.05,.2,1);
    z-index:7;display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0)}
  .drawer header{padding:24px 28px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .drawer .eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  .drawer h2{margin:0;font-size:32px;letter-spacing:-0.02em;font-weight:900;line-height:1}
  .drawer .close{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-dim);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;flex:none}
  .drawer .close:hover{color:var(--ink);border-color:var(--accent)}
  .drawer .body{padding:24px 28px;overflow-y:auto;flex:1;font-size:14px;line-height:1.6;color:var(--ink-dim)}
  .drawer .body p{margin:0 0 14px}
  .drawer .body strong{color:var(--ink);font-weight:600}
  .drawer .body h3{color:var(--ink);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:24px 0 10px;font-weight:700}
  .drawer .body ul{padding-left:18px;margin:8px 0 16px}
  .drawer .body li{margin-bottom:6px}
  .drawer .stat{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:18px 0}
  .drawer .stat > div{background:var(--panel);padding:14px 16px}
  .drawer .stat .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
  .drawer .stat .v{font-size:20px;color:var(--ink);font-weight:700;margin-top:4px;letter-spacing:-0.02em}
  .drawer .cta{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#0d0e10;padding:12px 18px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:none;margin-top:8px}
  .drawer .cta:hover{background:#ff8138}
  .drawer footer{padding:14px 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}

  /* ── side nav (visible list of pages) ─────── */
  .sidenav{
    position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:5;
    display:flex;flex-direction:column;gap:2px;
    border:1px solid var(--line);border-radius:8px;overflow:hidden;
    background:rgba(15,17,21,.55);backdrop-filter:blur(8px);
  }
  .sidenav button{
    appearance:none;border:none;background:transparent;color:var(--ink-dim);
    font:inherit;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    padding:10px 14px;cursor:pointer;text-align:left;border-left:2px solid transparent;
    display:flex;align-items:center;gap:10px;min-width:160px;
  }
  .sidenav button:hover{color:var(--ink);background:rgba(255,106,26,.06)}
  .sidenav button.active{color:var(--accent);border-left-color:var(--accent);background:rgba(255,106,26,.08)}
  .sidenav button .num{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--ink-dim);font-size:9px}

  /* ── tweaks panel ──────────────────────────── */
  .tweaks{
    position:fixed;right:24px;bottom:80px;z-index:8;width:260px;
    background:rgba(15,17,21,.95);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;backdrop-filter:blur(10px);display:none;
  }
  .tweaks.open{display:block}
  .tweaks h4{margin:0 0 10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .tweaks .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12px}
  .tweaks .row:first-of-type{border-top:0}
  .tweaks select,.tweaks input[type=range]{background:#0d0e10;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:inherit;font-size:11px}
  .tweaks input[type=range]{padding:0;width:120px}

  /* ── boot overlay ──────────────────────────── */
  #boot{position:fixed;inset:0;background:#0d0e10;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;color:var(--ink);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.1em;gap:14px;transition:opacity .5s;}
  #boot.hide{opacity:0;pointer-events:none}
  #boot .lbig{font-family:"Arial Black",sans-serif;font-size:48px;letter-spacing:-0.04em;color:var(--ink)}
  #boot .lbig sub{font-size:18px;vertical-align:-4px}
  #boot .accent{color:var(--accent)}
  #boot .bar{width:240px;height:2px;background:var(--line);overflow:hidden}
  #boot .bar i{display:block;height:100%;background:var(--accent);width:0;animation:loadbar 1.4s ease forwards}
  @keyframes loadbar{to{width:100%}}

  @media (max-width:760px){
    .sidenav{display:none}
    .brand .e{display:none}
    .topright{font-size:10px}
    .topright .pill span:last-child{display:none}
  }
</style>
</head>
<body>

<div id="boot">
  <div class="lbig">C<sub>3D</sub><span style="font-style:italic;font-family:'Times New Roman',serif;font-weight:500" class="accent">E</span></div>
  <div>INITIALIZING ENDSTOPS<span class="accent">_</span></div>
  <div class="bar"><i></i></div>
</div>

<div class="brandbar">
  <div class="brand">
    <span class="c">C<sub>3D</sub></span><span style="color:var(--ink-dim);font-weight:300;font-size:24px;margin:0 -2px">·</span><span class="e">E<span class="ng">ngineering</span></span>
    <span class="dot" title="online"></span>
  </div>
  <div class="topright">
    <div class="pill"><span class="led"></span><span>READY</span></div>
    <button id="soundBtn" class="on" title="toggle stepper sound">🔊 SFX</button>

<nav class="sidenav" id="sidenav"></nav>

<div class="hintbar">
  <div class="keys">
    <span><b>DRAG</b>orbit</span>
    <span><b>SCROLL</b>zoom</span>
    <span><b>CLICK</b>navigate bed</span>
  </div>
  <div class="coords">X:<span class="v" id="cx">110.0</span>  Y:<span class="v" id="cy">110.0</span>  Z:<span class="v" id="cz">005.0</span>  F:<span class="v" id="cf">0000</span></div>
</div>

<div id="label"></div>

<aside class="drawer" id="drawer">
  <header>
    <div>
      <div class="eyebrow" id="dEyebrow">PAGE</div>
      <h2 id="dTitle">Title</h2>
    </div>
    <button class="close" id="dClose" aria-label="close">✕</button>
  </header>
  <div class="body" id="dBody"></div>
  <footer>
    <span id="dCoord">G1 X110 Y110</span>
    <span>CEAZERS 3D · EST. 2021</span>
  </footer>
</aside>

<div class="tweaks" id="tweaks">
  <h4>Tweaks</h4>
  <div class="row"><label>Frame style</label>
    <select id="tFrame"><option value="dark">Dark industrial</option><option value="white">Voron white</option><option value="raw">Raw aluminum</option></select>
  </div>
  <div class="row"><label>Bed lighting</label>
    <select id="tLight"><option value="warm">Warm</option><option value="cool">Cool</option><option value="neutral">Neutral</option></select>
  </div>
  <div class="row"><label>Feed rate</label>
    <input id="tSpeed" type="range" min="40" max="220" value="120">
  </div>
  <div class="row"><label>Print demo</label>
    <select id="tPrint"><option value="benchy">3DBenchy</option><option value="cube">Calibration cube</option><option value="off">Off</option></select>
  </div>
</div>

<div id="scene"></div>

<!-- Three.js r128 — last UMD-friendly version with OrbitControls under examples/js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>

<script>
/* =========================================================
   CEAZERS 3D — interactive printer
   - CoreXY style printer (Bambu/Voron silhouette)
   - 9 invisible hotspots on a 220x220 bed
   - Click → realistic X-then-Y gantry motion
   - LCD on front frame mirrors current page
   ========================================================= */

const TWEAKS = /*EDITMODE-BEGIN*/{
  "frame":"dark",
  "lighting":"warm",
  "feedrate":120,
  "printDemo":"benchy"
}/*EDITMODE-END*/;

/* ---------- pages mapped to bed positions (mm) ---------- */
/* Bed is 220x220, origin at front-left corner. */
const PAGES = [
  { id:"home",     title:"Home",          eyebrow:"GANTRY HOME",       x:110, y:110, code:"00", lcd:"HOME" },
  { id:"about",    title:"About",         eyebrow:"WHO WE ARE",        x:55,  y:165, code:"01", lcd:"ABOUT" },
  { id:"services", title:"Services",      eyebrow:"WHAT WE DO",        x:165, y:165, code:"02", lcd:"SERVICES" },
  { id:"portfolio",title:"Portfolio",     eyebrow:"SELECTED WORK",     x:55,  y:55,  code:"03", lcd:"GALLERY" },
  { id:"shop",     title:"Shop",          eyebrow:"BUY PARTS & PRINTS",x:165, y:55,  code:"04", lcd:"SHOP" },
  { id:"materials",title:"Materials",     eyebrow:"FILAMENTS & SPECS", x:30,  y:110, code:"05", lcd:"MATERIAL" },
  { id:"process",  title:"Process",       eyebrow:"HOW IT WORKS",      x:190, y:110, code:"06", lcd:"PROCESS" },
  { id:"blog",     title:"Notes",         eyebrow:"BLOG & TUTORIALS",  x:110, y:30,  code:"07", lcd:"NOTES" },
  { id:"contact",  title:"Contact",       eyebrow:"START A PROJECT",   x:110, y:190, code:"08", lcd:"CONTACT" },
];

/* ---------- page content ---------- */
/* Every drawer ends with a CTA that deep-links to the corresponding
   section of the full site at /home#<anchor>. The "home" drawer's
   CTA is the main "Enter Site" handoff from the interactive landing. */
const CONTENT = {
  home:`<p><strong>Ceazers 3D · Engineering</strong> is a Durban-based studio for industrial design, additive manufacturing and rapid prototyping. Click anywhere on the bed to preview a section — the gantry will move where you point.</p>
        <h3>Quick stats</h3>
        <div class="stat">
          <div><div class="k">Projects shipped</div><div class="v">100+</div></div>
          <div><div class="k">First-draft</div><div class="v">48 h</div></div>
          <div><div class="k">Disciplines</div><div class="v">5+</div></div>
          <div><div class="k">Satisfaction</div><div class="v">100%</div></div>
        </div>
        <p>Hover the printer to discover hotspots. Drag to orbit, scroll to zoom.</p>
        <a class="cta" href="/home">Enter full site →</a>`,
  about:`<p>Founded by an engineer who got tired of waiting weeks for prototype shops, <strong>Ceazers 3D</strong> turns sketches into hold-in-your-hand parts in days, not weeks.</p>
         <h3>What we believe</h3>
         <ul><li>Functional parts beat pretty renders.</li><li>Iteration cost should be low enough to be wrong on purpose.</li><li>Local manufacturing matters.</li></ul>
         <p>Based in Durban, KZN. Shipping nationwide.</p>
         <a class="cta" href="/home#about">View full page →</a>`,
  services:`<p>End-to-end product realization, picked à la carte or as a package.</p>
            <h3>Capabilities</h3>
            <ul><li><strong>CAD design &amp; 3D modelling</strong> — concept → CMF → CAD</li><li><strong>FDM 3D printing</strong> — engineering plastics</li><li><strong>Rapid prototyping</strong> — fit, form, mechanism testing</li><li><strong>Engineering drawings</strong> — manufacture-ready</li><li><strong>Product development support</strong></li></ul>
            <a class="cta" href="/home#services">View full page →</a>`,
  portfolio:`<p>Selected projects. Open the full site for case studies and photos.</p>
             <div class="stat">
                <div><div class="k">Drone gimbal</div><div class="v">CF-PA</div></div>
                <div><div class="k">EV charger</div><div class="v">ASA</div></div>
                <div><div class="k">Dental jig</div><div class="v">Resin</div></div>
                <div><div class="k">Robot arm</div><div class="v">PETG-CF</div></div>
             </div>
             <p>50+ shipped projects across consumer, medical, and industrial.</p>
             <a class="cta" href="/home#projects">View full page →</a>`,
  shop:`<p>Off-the-shelf prints, replacement parts and Ceazers-designed accessories. <em>Catalog launching soon.</em></p>
        <h3>Categories</h3>
        <ul><li>Desk &amp; cable management</li><li>Tabletop / miniatures</li><li>Workshop tools &amp; jigs</li><li>Replacement parts library</li></ul>
        <a class="cta" href="/home#contact">Request an item →</a>`,
  materials:`<p>We keep a deep shelf so prototype #4 doesn't wait on a filament order.</p>
             <h3>In stock</h3>
             <ul><li><strong>PLA / PLA+</strong> — visual prototypes</li><li><strong>PETG</strong> — outdoor &amp; food-contact</li><li><strong>ABS / ASA</strong> — automotive &amp; UV-stable</li><li><strong>PA-CF, PET-CF</strong> — load-bearing</li><li><strong>TPU 95A</strong> — gaskets &amp; grips</li></ul>
             <a class="cta" href="/home#materials">View full page →</a>`,
  process:`<p>How a project moves through the studio:</p>
           <h3>Pipeline</h3>
           <ul><li><strong>01 ·</strong> Brief &amp; constraints</li><li><strong>02 ·</strong> CAD &amp; DfAM review</li><li><strong>03 ·</strong> First print, iterate</li><li><strong>04 ·</strong> Validation &amp; finishing</li><li><strong>05 ·</strong> Hand-off or batch run</li></ul>
           <p>Most jobs finish their first loop within <strong>72 hours</strong>.</p>
           <a class="cta" href="/home#services">View full page →</a>`,
  blog:`<p>Field notes from the workbench. <em>Blog launching soon.</em></p>
        <h3>Planned posts</h3>
        <ul><li>Why your bed-leveling won't fix that warp</li><li>PA-CF drying — the boring habit that saves prints</li><li>Designing snap-fits that survive 100+ cycles</li><li>A field guide to print orientation</li></ul>
        <a class="cta" href="/home#faq">Read the FAQ →</a>`,
  contact:`<p>Have a part to make? Send drawings, sketches, or a sticky-note photo — we'll quote within a business day.</p>
           <div class="stat">
              <div><div class="k">Based in</div><div class="v" style="font-size:14px">Durban, KZN</div></div>
              <div><div class="k">Response</div><div class="v" style="font-size:14px">&lt; 24 h</div></div>
           </div>
           <a class="cta" href="/home#contact">Start a project →</a>`,
};

/* =========================================================
   THREE.JS SETUP
   ========================================================= */

const sceneEl = document.getElementById('scene');
const W = () => window.innerWidth, H = () => window.innerHeight;

const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W(),H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if(THREE.SRGBColorSpace !== undefined){ renderer.outputColorSpace = THREE.SRGBColorSpace; }
else if(THREE.sRGBEncoding !== undefined){ renderer.outputEncoding = THREE.sRGBEncoding; }
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
sceneEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e10);
scene.fog = new THREE.Fog(0x0d0e10, 700, 1500);

const camera = new THREE.PerspectiveCamera(40, W()/H(), 1, 5000);
camera.position.set(520, 460, 620);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 160, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 280;
controls.maxDistance = 1100;
controls.maxPolarAngle = Math.PI*0.49;
controls.minPolarAngle = Math.PI*0.12;

/* ---------- LIGHTING ---------- */
const hemi = new THREE.HemisphereLight(0xb6c8ff, 0x222018, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(300, 500, 250);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -350; key.shadow.camera.right = 350;
key.shadow.camera.top = 350; key.shadow.camera.bottom = -350;
key.shadow.camera.near = 50; key.shadow.camera.far = 1200;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0xff7a2a, 0.45);
rim.position.set(-400, 200, -300);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x88a2ff, 0.25);
fill.position.set(-200, 100, 400);
scene.add(fill);

/* bed inner glow (will be repositioned per tweak) */
const bedLight = new THREE.PointLight(0xffb070, 0.9, 350, 2);
bedLight.position.set(0, 60, 0);
scene.add(bedLight);

/* ---------- GROUND ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(1200, 64),
  new THREE.MeshStandardMaterial({color:0x0a0b0d, roughness:0.95, metalness:0})
);

/* helpers */
function box(w,h,d, mat, x=0,y=0,z=0, parent=printer){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function rbox(w,h,d, r, mat, x=0,y=0,z=0, parent=printer){
  // rounded box via ExtrudeGeometry
  const shape = new THREE.Shape();
  const w2=w/2, d2=d/2, rr=Math.min(r, w2, d2);
  shape.moveTo(-w2+rr,-d2);
  shape.lineTo(w2-rr,-d2);
  shape.quadraticCurveTo(w2,-d2, w2,-d2+rr);
  shape.lineTo(w2, d2-rr);
  shape.quadraticCurveTo(w2, d2, w2-rr, d2);
  shape.lineTo(-w2+rr, d2);
  shape.quadraticCurveTo(-w2, d2, -w2, d2-rr);
  shape.lineTo(-w2, -d2+rr);
  shape.quadraticCurveTo(-w2,-d2, -w2+rr,-d2);
  const geo = new THREE.ExtrudeGeometry(shape, {depth:h, bevelEnabled:true, bevelThickness:0.6, bevelSize:0.6, bevelSegments:2, curveSegments:6});
  geo.translate(0,0,-h/2);
  geo.rotateX(-Math.PI/2);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(r, h, mat, x=0,y=0,z=0, axis='y', parent=printer, segs=24){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segs), mat);
  if(axis==='x') m.rotation.z = Math.PI/2;
  if(axis==='z') m.rotation.x = Math.PI/2;
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
/* aluminum extrusion (square with t-slot grooves on 4 sides) */
function extrusion(length, axis, mat, x=0,y=0,z=0, parent=printer, size=20){
  const grp = new THREE.Group();
  // body
  const body = new THREE.Mesh(new THREE.BoxGeometry(size,size,length), mat);
  body.castShadow=true; body.receiveShadow=true;
  grp.add(body);
  // 4 slot grooves (thin recessed strips on each face)
  const slotMat = MATS.frameDark;
  const sw = size*0.45, sd = 1.2;
  // +X face
  const sx = new THREE.Mesh(new THREE.BoxGeometry(sd, sw, length-2), slotMat);
  sx.position.x = size/2; grp.add(sx);
  const sx2 = sx.clone(); sx2.position.x = -size/2; grp.add(sx2);
  const sy = new THREE.Mesh(new THREE.BoxGeometry(sw, sd, length-2), slotMat);
  sy.position.y = size/2; grp.add(sy);
  const sy2 = sy.clone(); sy2.position.y = -size/2; grp.add(sy2);
  // orient
  if(axis==='x') grp.rotation.y = Math.PI/2;
  if(axis==='y') grp.rotation.x = Math.PI/2;
  grp.position.set(x,y,z);
  parent.add(grp);
  return grp;
}
/* MGN-style linear rail along an axis */
function linearRail(length, axis, mat, x=0,y=0,z=0, parent=printer){
  const grp = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(8,4,length), mat);
  grp.add(base);
  const top = new THREE.Mesh(new THREE.BoxGeometry(5,3,length), MATS.rail);
  top.position.y = 3.5; grp.add(top);
  // bolt holes (decorative dots)
  const hcount = Math.floor(length/40);
  for(let i=0;i<hcount;i++){
    const d = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1.2,8), MATS.frameDark);
    d.rotation.x = Math.PI/2;
    d.position.set(0, 2.1, -length/2 + 20 + i*40);
    grp.add(d);
  }
  if(axis==='x') grp.rotation.y = Math.PI/2;
  grp.position.set(x,y,z);
  grp.traverse(o=>{ if(o.isMesh){o.castShadow=true; o.receiveShadow=true;} });
  parent.add(grp);
  return grp;
}
/* NEMA17 stepper motor */
function nema17(mat, x=0,y=0,z=0, parent=printer, axis='y'){
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(42,42,42), MATS.motor);
  body.castShadow=true; body.receiveShadow=true;
  grp.add(body);
  // chamfered ring at top
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(20,20,3,24), MATS.motorTop);
  cap.position.y = 22; grp.add(cap);
  // shaft
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,8,16), MATS.rail);
  shaft.position.y = 26; grp.add(shaft);
  // pulley
  const pulley = new THREE.Mesh(new THREE.CylinderGeometry(7,7,7,24), MATS.frameDark);
  pulley.position.y = 30; grp.add(pulley);
  const pTop = new THREE.Mesh(new THREE.CylinderGeometry(8,8,1.5,24), MATS.rail);
  pTop.position.y = 34; grp.add(pTop);
  const pBot = new THREE.Mesh(new THREE.CylinderGeometry(8,8,1.5,24), MATS.rail);
  pBot.position.y = 26.5; grp.add(pBot);
  // wires (small cable stub)
  const cable = new THREE.Mesh(new THREE.CylinderGeometry(2,2,8,8), MATS.rubber);
  cable.position.set(15, -22, 0); cable.rotation.x = Math.PI/2;
  grp.add(cable);
  if(axis==='x'){ grp.rotation.z = Math.PI/2; }
  if(axis==='-y'){ grp.rotation.x = Math.PI; }
  grp.position.set(x,y,z);
  parent.add(grp);
  return grp;
}

/* =========================================================
   INTERACTION
   ========================================================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;

function setMouse(ev){
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x =  ((ev.clientX - r.left)/r.width)*2 - 1;
  mouse.y = -((ev.clientY - r.top)/r.height)*2 + 1;
}

const labelEl = document.getElementById('label');

function onMove(ev){
  setMouse(ev);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(hotspots, false);
  if(hits.length){
    const h = hits[0].object;
    if(hovered !== h){
      if(hovered){ hovered.userData.ring.material.opacity = 0; }
      hovered = h;
      hovered.userData.ring.material.opacity = 0.85;
    }
    const p = h.userData.page;
    labelEl.style.display = 'block';
    labelEl.style.left = ev.clientX+'px';
    labelEl.style.top = ev.clientY+'px';
    labelEl.innerHTML = `${p.title}<div class="meta">G1 X${p.x} Y${p.y} F${STATE.feed*60|0}</div>`;
    document.body.style.cursor = 'pointer';
  } else {
    if(hovered){ hovered.userData.ring.material.opacity = 0; hovered=null; }
    labelEl.style.display = 'none';
    document.body.style.cursor = '';
  }
}

function onClick(ev){
  setMouse(ev);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(hotspots, false);
  if(hits.length){
    const p = hits[0].object.userData.page;
    navigateTo(p);
  }
}

renderer.domElement.addEventListener('pointermove', onMove);
renderer.domElement.addEventListener('click', onClick);

/* =========================================================
   MOTION — realistic X-then-Y G-code style
   ========================================================= */
function navigateTo(page){
  STATE.tgtX = page.x;
  STATE.tgtY = page.y;
  STATE.page = page.id;
  STATE.lcd  = page.lcd;
  STATE.moving = true;
  STATE.axis = 'x';
  // active ring jumps to target
  const w = bedToWorld(page.x, page.y);
  activeRing.position.set(w.x, 47.2, w.z);
  activeDot.position.set(w.x, 47.3, w.z);

  // update side nav
  document.querySelectorAll('.sidenav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.id===page.id);
  });

  // open drawer immediately with content
  openDrawer(page);

  // sound
  startStepperSound();
}

function step(dt){
  if(!STATE.moving) return;
  const speed = TWEAKS.feedrate; // mm/s
  let done = false;
  if(STATE.axis === 'x'){
    const dx = STATE.tgtX - STATE.bedX;
    const move = Math.sign(dx)*Math.min(Math.abs(dx), speed*dt);
    STATE.bedX += move;
    if(Math.abs(STATE.tgtX - STATE.bedX) < 0.05){
      STATE.bedX = STATE.tgtX;
      STATE.axis = 'y';
    }
  } else if(STATE.axis === 'y'){
    const dy = STATE.tgtY - STATE.bedY;
    const move = Math.sign(dy)*Math.min(Math.abs(dy), speed*dt);
    STATE.bedY += move;
    if(Math.abs(STATE.tgtY - STATE.bedY) < 0.05){
      STATE.bedY = STATE.tgtY;
      STATE.moving = false;
      STATE.axis = null;
      stopStepperSound();
    }
  }
  applyGantry();
}

/* =========================================================
   DRAWER + UI
   ========================================================= */
const drawer = document.getElementById('drawer');
const dTitle = document.getElementById('dTitle');
const dEyebrow = document.getElementById('dEyebrow');
const dBody = document.getElementById('dBody');
const dCoord = document.getElementById('dCoord');
function openDrawer(page){
  dTitle.textContent = page.title;
  dEyebrow.textContent = page.eyebrow;
  dBody.innerHTML = CONTENT[page.id] || '<p>Coming soon.</p>';
  dCoord.textContent = `G1 X${page.x} Y${page.y} F${TWEAKS.feedrate*60}`;
  drawer.classList.add('open');
  // persist
  try{ localStorage.setItem('ceazers_page', page.id); }catch(_){}
}
document.getElementById('dClose').addEventListener('click', ()=>drawer.classList.remove('open'));

/* side nav build */
const sideNav = document.getElementById('sidenav');
PAGES.forEach((p,i)=>{
  const b = document.createElement('button');
  b.dataset.id = p.id;
  b.innerHTML = `<span class="num">${p.code}</span> ${p.title}`;
  b.addEventListener('click', ()=>navigateTo(p));
  sideNav.appendChild(b);
});

/* =========================================================
   STEPPER SOUND (synthesized)
   ========================================================= */
let audioCtx = null;
let stepperGain = null;
let stepperSrc = null;
let soundOn = true;
function ensureAudio(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ soundOn = false; }
}
function startStepperSound(){
  if(!soundOn) return;
  ensureAudio(); if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  // build a square-ish stepper buzz using two oscillators
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  osc1.type = 'sawtooth'; osc1.frequency.value = 220;
  osc2.type = 'square';   osc2.frequency.value = 165;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.0;
  // small LFO to add "stepper" character
  const lfo = audioCtx.createOscillator();
  lfo.type = 'square'; lfo.frequency.value = 28;
  const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.025;
  lfo.connect(lfoGain).connect(gain.gain);

  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = 700; filt.Q.value = 6;

  osc1.connect(filt); osc2.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
  osc1.start(); osc2.start(); lfo.start();
  // attack
  gain.gain.cancelScheduledValues(audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime+0.04);
  stepperGain = gain;
  stepperSrc = {osc1,osc2,lfo,filt};
}
function stopStepperSound(){
  if(!stepperGain || !audioCtx) return;
  const t = audioCtx.currentTime;
  stepperGain.gain.cancelScheduledValues(t);
  stepperGain.gain.linearRampToValueAtTime(0, t+0.1);
  const s = stepperSrc;
  setTimeout(()=>{ try{s.osc1.stop();s.osc2.stop();s.lfo.stop();}catch(_){} }, 200);
  stepperGain = null; stepperSrc = null;
}
document.getElementById('soundBtn').addEventListener('click', (e)=>{
  soundOn = !soundOn;
  e.currentTarget.classList.toggle('on', soundOn);
  e.currentTarget.textContent = soundOn ? '🔊 SFX' : '🔇 SFX';
  if(!soundOn) stopStepperSound();
});

/* =========================================================
   COORDS HUD
   ========================================================= */
const cx = document.getElementById('cx');
const cy = document.getElementById('cy');
const cz = document.getElementById('cz');
const cf = document.getElementById('cf');
function updateHUD(){
  cx.textContent = STATE.bedX.toFixed(1).padStart(5,'0');
  cy.textContent = STATE.bedY.toFixed(1).padStart(5,'0');
  cz.textContent = '005.0';
  cf.textContent = (STATE.moving? TWEAKS.feedrate*60 : 0).toString().padStart(4,'0');
}

/* =========================================================
   TWEAKS
   ========================================================= */
const tweaksEl = document.getElementById('tweaks');
document.getElementById('tweakBtn').addEventListener('click', (e)=>{
  tweaksEl.classList.toggle('open');
  e.currentTarget.classList.toggle('on');
});
const tFrame = document.getElementById('tFrame');
const tLight = document.getElementById('tLight');
const tSpeed = document.getElementById('tSpeed');
const tPrint = document.getElementById('tPrint');
tFrame.value = TWEAKS.frame; tLight.value = TWEAKS.lighting; tSpeed.value = TWEAKS.feedrate; tPrint.value = TWEAKS.printDemo;

function applyFrameStyle(v){
  TWEAKS.frame = v;
  if(v==='dark'){
    MATS.frame.color.setHex(0x18191c); MATS.frame.metalness=0.7; MATS.frame.roughness=0.45;
    MATS.panel.color.setHex(0x111215);
  }else if(v==='white'){
    MATS.frame.color.setHex(0xe9e7df); MATS.frame.metalness=0.2; MATS.frame.roughness=0.55;
    MATS.panel.color.setHex(0xf2f1ec);
  }else{
    MATS.frame.color.setHex(0x9aa0a8); MATS.frame.metalness=0.95; MATS.frame.roughness=0.3;
    MATS.panel.color.setHex(0x4a4d52);
  }
}
function applyLighting(v){
  TWEAKS.lighting = v;
  if(v==='warm'){ bedLight.color.setHex(0xffb070); rim.color.setHex(0xff7a2a); }
  else if(v==='cool'){ bedLight.color.setHex(0x70b0ff); rim.color.setHex(0x4a8cff); }
  else { bedLight.color.setHex(0xffffff); rim.color.setHex(0xaaaaaa); }
}
tFrame.addEventListener('change', e=>{ applyFrameStyle(e.target.value); persistTweaks(); });
tLight.addEventListener('change', e=>{ applyLighting(e.target.value); persistTweaks(); });
tSpeed.addEventListener('input', e=>{ TWEAKS.feedrate = +e.target.value; persistTweaks(); });
tPrint.addEventListener('change', e=>{ TWEAKS.printDemo = e.target.value; buildPrintObj(e.target.value); persistTweaks(); });

function persistTweaks(){
  window.parent.postMessage({type:'__edit_mode_set_keys', edits: TWEAKS}, '*');
}

/* edit-mode protocol */
window.addEventListener('message', (e)=>{
  if(!e.data) return;
  if(e.data.type==='__activate_edit_mode'){ tweaksEl.classList.add('open'); }
  if(e.data.type==='__deactivate_edit_mode'){ tweaksEl.classList.remove('open'); }
});
window.parent.postMessage({type:'__edit_mode_available'}, '*');

/* =========================================================
   ANIMATION LOOP
   ========================================================= */
let last = performance.now();
let spoolPhase = 0;
function tick(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  step(dt);
  controls.update();

  // active ring pulse
  const t = now*0.001;
  const s = 1 + Math.sin(t*3)*0.05;
  activeRing.scale.setScalar(s);
  activeDot.material.opacity = 0.6 + Math.sin(t*4)*0.4;

  // hover ring pulse
  if(hovered){
    hovered.userData.ring.material.opacity = 0.6 + Math.sin(t*5)*0.3;
  }

  // fan spin
  fanBlades.rotation.z += dt*18;

  // spool spin while moving (each spool group)
  spools.forEach(sg => {
    if(STATE.moving) sg.rotation.z += dt*1.4;
    sg.rotation.z += Math.sin(t)*0.0002;
  });

  // toolhead LED pulse
  toolLed.material.color.setHex(STATE.moving ? 0xff6a1a : 0x7ee08a);

  // heater glow
  heaterBlock.material.emissiveIntensity = 0.45 + Math.sin(t*1.5)*0.1;

  // LCD
  if(now - lastLcd > 120){
    renderLCD({lcd:STATE.lcd, x:STATE.bedX, y:STATE.bedY, moving:STATE.moving});
    lastLcd = now;
  }

  updateHUD();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
let lastLcd = 0;

/* =========================================================
   BOOTSTRAP
   ========================================================= */
applyFrameStyle(TWEAKS.frame);
applyLighting(TWEAKS.lighting);

// restore last page
let initialPage = PAGES[0];
try{
  const saved = localStorage.getItem('ceazers_page');
  if(saved){ const p = PAGES.find(x=>x.id===saved); if(p) initialPage = p; }
}catch(_){}
// jump (no animation) to initial position, then open its drawer
STATE.bedX = initialPage.x; STATE.bedY = initialPage.y;
STATE.tgtX = initialPage.x; STATE.tgtY = initialPage.y;
STATE.page = initialPage.id; STATE.lcd = initialPage.lcd;
applyGantry();
document.querySelectorAll('.sidenav button').forEach(b=>{
  b.classList.toggle('active', b.dataset.id===initialPage.id);
});
const w0 = bedToWorld(initialPage.x, initialPage.y);
activeRing.position.set(w0.x, 47.2, w0.z);
activeDot.position.set(w0.x, 47.3, w0.z);
openDrawer(initialPage);
renderLCD({lcd:STATE.lcd, x:STATE.bedX, y:STATE.bedY, moving:false});

/* boot fade out */
setTimeout(()=>{ document.getElementById('boot').classList.add('hide'); }, 1500);
setTimeout(()=>{ const b=document.getElementById('boot'); if(b) b.style.display='none'; }, 2200);

window.addEventListener('resize', ()=>{
  camera.aspect = W()/H(); camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
});

requestAnimationFrame(tick);
</script>
